<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Login — PakCash</title><link href="/css/app.css" rel="stylesheet"/><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="/js/supabase-config.js"></script><script src="/js/auth.js"></script><meta content="PakCash account access." name="description"/><meta content="noindex,nofollow" name="robots"/></head>
<body><main class="auth-shell"><section class="auth-card">
<div class="brand">🇵🇰 PakCash</div><h1>Log in</h1><p class="small">Use the email and password from your account.</p>
<div aria-live="polite" class="form-msg" id="msg" role="status"></div>
<form id="loginForm">
<div class="field"><label for="email">Email</label><input autocomplete="email" id="email" required="" type="email"/></div>
<div class="field"><label for="password">Password</label><input autocomplete="current-password" id="password" required="" type="password"/></div>
<button class="btn full-width" id="loginBtn" type="submit">Log in</button>
</form>
<div class="actions"><a class="btn secondary" href="/register.html">Create account</a><a class="btn secondary" href="/recovery.html">Forgot password?</a></div>
</section></main>
<script src="/js/page-forms.js"></script><script src="/js/ui.js"></script></body></html>
